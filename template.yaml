AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: Static website deployment with apex redirect and shared ACM certificate
Parameters:
  DomainName:
    Description: Name of the domain
    Type: String
    ConstraintDescription: must be the name of an existing Hosted Zone in Route53.
  HostName:
    Description: Hostname part of the URL for the website.
    Type: String
  HostedZoneId:
    Description: Hosted Zone ID needed for SSL certificate validation.
    Type: String
  Subject:
    Type: String
    Description: Contact us email subject
  ToEmailAddress:
    Type: String
    Description: Email address you want contact form submittions to go to
  ReCaptchaServerSecret:
    Type: String
    Description: Your Google reCAPTCHA server secret
  EdgeLambdaArn:
    Type: String
    Description: Edge Lambda ARN for index pages
    Default: None
  SSLCertificateArn:
    Type: String
    Description: SSL Certificate ARN
    Default: None
  DomainApexRedirect:
    Type: String
    Description: Do you want to redirect the domain apex to this website?
    AllowedValues:
      - 'Yes'
      - 'No'
    Default: 'Yes'
Conditions:
  IsUsEast1: !Equals 
    - !Ref AWS::Region
    - us-east-1
  IsDomainApexRedirect: !Equals
    - !Ref DomainApexRedirect
    - 'Yes'
Resources:
  ContactUsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName:
        Fn::Join:
          - ''
          - - Ref: AWS::StackName
            - ' Topic'
      Subscription:
        - Endpoint: !Ref ToEmailAddress
          Protocol: email
      TopicName:
        Fn::Join:
          - ''
          - - Ref: AWS::StackName
            - '-topic'
  ContactUsFunctionApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors: "'*'"
  ContactUsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-contactUsFormProcessor
      Description: Contact us form processor
      Handler: index.handler
      CodeUri: src/contactUsFormProcessor
      Runtime: nodejs24.x
      Timeout: 5
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ContactUsSNSTopic.TopicName
      Events:
        PostEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ContactUsFunctionApi
            Path: /
            Method: post
      Environment:
        Variables:
          ReCaptchaSecret: !Ref ReCaptchaServerSecret
          ContactUsSNSTopic: !Ref ContactUsSNSTopic
          Subject: !Ref Subject
  CloudFrontS3IndexHtml:
    Type: AWS::Serverless::Function
    Condition: IsUsEast1
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cloudFrontS3IndexHtml
      Description: CloudFront S3 index.html edge lambda
      Handler: index.handler
      CodeUri: src/cloudFrontS3IndexHtml
      Runtime: nodejs24.x
      Timeout: 5
      AutoPublishAlias: riznob
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
            - edgelambda.amazonaws.com
          Action: sts:AssumeRole
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:  
        Statement:  
        - Action: s3:GetObject
          Effect: Allow 
          Resource: !Sub ${S3Bucket.Arn}/*
          Principal:
            Service: cloudfront.amazonaws.com
          Condition:
            StringEquals:
              AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
        - Effect: Deny
          Principal: '*'
          Action: 's3:*'
          Resource: 
            - !Sub ${S3Bucket.Arn}/*
            - !GetAtt S3Bucket.Arn
          Condition:
            Bool: 
              AWS:SecureTransport: false
  SSLCertificate:
    Condition: IsUsEast1
    Type: AWS::CertificateManager::Certificate
    Properties: 
      DomainName: !Sub ${HostName}.${DomainName}
      SubjectAlternativeNames: !If
        - IsDomainApexRedirect
        - - !Ref DomainName
        - !Ref AWS::NoValue
      DomainValidationOptions:
      - DomainName: !Sub ${HostName}.${DomainName}
        HostedZoneId: !Ref HostedZoneId
      - !If
        - IsDomainApexRedirect
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue
      ValidationMethod: DNS
  CloudFrontDistributionOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties: 
      OriginAccessControlConfig: 
        Description: Access control for CloudFront distribution
        Name: !Sub ${AWS::StackName}-access-control
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
        - DomainName: !GetAtt S3Bucket.DomainName
          Id: !Ref S3Bucket
          OriginAccessControlId: !GetAtt CloudFrontDistributionOriginAccessControl.Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        Enabled: 'true'
        HttpVersion: http2
        Aliases:
        - !Sub ${HostName}.${DomainName}
        DefaultCacheBehavior:
          AllowedMethods:
          - GET
          - HEAD
          TargetOriginId: !Ref S3Bucket
          ForwardedValues:
            QueryString: 'false'
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          LambdaFunctionAssociations:
          - EventType: origin-request
            LambdaFunctionARN: !If [IsUsEast1, !Ref CloudFrontS3IndexHtml.Version, !Ref EdgeLambdaArn]
        ViewerCertificate:
          AcmCertificateArn: !If [IsUsEast1, !Ref SSLCertificate, !Ref SSLCertificateArn]
          SslSupportMethod: sni-only
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
  RedirectFunction:
    Condition: IsDomainApexRedirect
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "redirect-${AWS::StackName}"
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          var redirectUrl = "https://${HostName}.${DomainName}" + req.uri;
          return {
            statusCode: 301,
            statusDescription: "Moved Permanently",
            headers: {
              "location": { "value": redirectUrl }
            }
          };
        }
      FunctionConfig:
        Comment: Redirect apex domain to hostname.domain
        Runtime: cloudfront-js-2.0
  RedirectDistribution:
    Condition: IsDomainApexRedirect
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Redirect apex domain to hostname.domain using CloudFront Function
        Aliases:
          - !Ref DomainName
        DefaultCacheBehavior:
          TargetOriginId: dummy-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirectFunction.FunctionARN
          ForwardedValues:
            QueryString: true
        Origins:
          - Id: dummy-origin
            DomainName: example.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        ViewerCertificate:
          AcmCertificateArn: !If [IsUsEast1, !Ref SSLCertificate, !Ref SSLCertificateArn]
          SslSupportMethod: sni-only
  DNSRecord:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Sub ${HostName}.${DomainName}.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt CloudFrontDistribution.DomainName
  ApexRecord:
    Condition: IsDomainApexRedirect
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt RedirectDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID
  DeployUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub ${AWS::StackName}-deploy
      Path: "/"
      Policies:
      - PolicyName: cloudfront-s3-readwrite
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - cloudfront:CreateInvalidation
            Resource:
            - "*"
          - Effect: Allow
            Action:
            - s3:ListBucket
            Resource: !Sub arn:aws:s3:::${S3Bucket}
          - Effect: Allow
            Action:
            - s3:DeleteObject
            - s3:GetObject
            - s3:GetObjectAcl
            - s3:PutObject
            - s3:PutObjectAcl
            Resource: !Sub arn:aws:s3:::${S3Bucket}/*
Outputs:
  ApiUrl:
    Description: URL of your API endpoint
    Value: !Sub https://${ContactUsFunctionApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
  ApexRedirectDistributionId:
    Condition: IsDomainApexRedirect
    Description: Apex redirect CloudFront Distribution ID
    Value: !Ref RedirectDistribution
  IAMUser:
    Description: IAM User with permission to deploy
    Value: !Ref DeployUser
  S3Bucket:
    Description: S3 Bucket
    Value: !Ref S3Bucket